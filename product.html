const TABS = ['Технические', 'Аэродинамика', 'Габариты', 'Акустика'];

function tabTech(r, ser) {
  const set = C.FIELDSET[r.type];
  if (!set || !C.FIELDS[set]) {
    return '<h3>Технические характеристики</h3>' +
      '<p>Таблицы характеристик для этого изделия на сайте завода нет — опубликованы только предел ' +
      'огнестойкости, климатическое исполнение и предельная скорость среды. Они вынесены в паспорт слева, ' +
      'а выдуманной таблицы здесь не будет.</p>' +
      '<p class="small">' + esc(ser && ser.note ? ser.note : '') + '</p>';
  }
  const F = C.FIELDS[set];
  const val = k => {
    /* Завод публикует расход в тысячах м³/ч — печатаем в его единице */
    if (k === 'q')    return r.q === null ? null : C.dec((r.q / 1000).toFixed(r.q < 10000 ? 2 : 1));
    if (k === 'p')    return r.p === null ? null : C.fmt(r.p);
    if (k === 'n')    return r.n === null ? null : C.dec(r.n);
    if (k === 'rpm')  return r.rpm === null ? null : C.fmt(r.rpm);
    if (k === 'mass') { const m = massOf(r, st.ind); return m === null ? null : '≈ ' + C.fmt(m); }
    if (k === 't')    { const t = tempOf(r, st.ind); return t === null ? null : 'до ' + C.dec(t); }
    return null;
  };
  const rows = F.rows.map(f => {
    const v = val(f.k);
    return '<tr><td class="l">' + esc(f.l) + (f.u ? ', ' + esc(f.u) : '') + '</td>' +
           (v === null ? '<td class="no">не опубликовано</td>' : '<td>' + v + '</td>') + '</tr>';
  }).join('');
  /* Заголовок набора берём из данных только тогда, когда набор действительно
     «свой»: у осевых, крышных и ДУ завод показывает тот же набор полей, что и
     у радиальных, и подписывать их карточку «радиальные» было бы неверно. */
  const own = {rad:'rad', pyl:'pyl', vd:'pyl', ind:'pyl', shaht:'pyl', tyaga:'tyaga', kan:'kan'};
  const title = own[r.type] === set ? F.name : 'Технические характеристики';
  return '<h3>' + esc(title) + '</h3>' +
    '<div class="tbl-scroll"><table class="data"><caption class="vh">Технические характеристики ' +
      esc(titleOf(r)) + '</caption>' +
    '<thead><tr><th class="l" scope="col">Характеристика</th><th scope="col">Значение</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>' +
    '<p class="small" style="margin-top:12px">Набор полей повторяет боевую карточку для этого типа агрегата. Строки, ' +
      'которых завод не публикует — тип двигателя, относительный диаметр колеса, марка и количество ' +
      'виброизоляторов — оставлены пустыми намеренно: подставлять туда правдоподобные значения нельзя.</p>';
}

  {t:'Защитные решётки',    r:'vrp', s:'vrp-resh',  w:'номенклатура раздела уточняется'},
  {t:'Шумоглушители',       r:'kkr', s:'kkr-shum',  w:'номенклатура раздела уточняется'},
  {t:'Регуляторы оборотов', r:'avt', s:'avt-reg',   w:'номенклатура раздела уточняется'},
];
function parts() {
  return '<div class="docs">' + PARTS.map(p =>
    '<a class="doc" href="razdel.html?r=' + p.r + '&amp;s=' + p.s + '">' +
    '<span class="ic">' + (ICON[C.razdelOf(p.r) ? C.razdelOf(p.r).ic : 'fix'] || ICON.fix) + '</span>' +
    '<span class="body"><span class="nm">' + esc(p.t) + '</span><span class="gr">' + esc(p.w) + '</span></span>' +
    '<span class="meta">раздел каталога</span><span class="arr">' + ICON.arrow + '</span></a>').join('') + '</div>';
}

/* ── Другие серии с той же рабочей точкой ──────────────────────────── */
function covering(r) {
  if (r.q === null || r.p === null) return [];
  const best = {};
  for (const x of C.SKU) {
    if (x.mk === r.mk || x.q === null || x.p === null) continue;
    const d = Math.abs(Math.log(x.q / r.q)) + Math.abs(Math.log(x.p / r.p));
    if (d > 0.5) continue;
    if (!best[x.mk] || d < best[x.mk].d) best[x.mk] = {r:x, d:d};
  }
  return Object.keys(best).map(k => best[k]).sort((a, b) => a.d - b.d).slice(0, 6);
}
function also(r) {
  const list = covering(r);
  if (!list.length) {
    return '<p class="small">Позиций с близкой рабочей точкой в других сериях каталога не нашлось' +
      (r.q === null ? ': у этой позиции расход и давление заводом не опубликованы.' : '.') + '</p>';
  }
  return '<div class="docs">' + list.map(x => {
    const sb = C.subOf(x.r);
    const d = C.DATA[x.r.data] || C.DATA.part;
    return '<a class="doc" href="product.html?p=' + x.r.id + '">' +
      '<span class="ic">' + (ICON[sb && ICON[sb.ic] ? sb.ic : 'radial'] || ICON.radial) + '</span>' +
      '<span class="body"><span class="mk">' + esc(titleOf(x.r)) + '</span>' +
      '<span class="gr">' + esc(C.TYPE[x.r.type] || '') + (sb ? ' · ' + esc(sb.short) : '') +
      /* Состояние первоисточника видно сразу: половина близких по точке серий
         несёт на боевом сайте чужие таблицы, и молчать об этом нельзя */
      ' · <span class="st" data-s="' + d.s + '" title="' + esc(d.t) + '">' + d.short + '</span></span></span>' +
      '<span class="meta">' + C.fmt(x.r.q) + ' м³/ч · ' + C.fmt(x.r.p) + ' Па</span>' +
      '<span class="arr">' + ICON.arrow + '</span></a>';
  }).join('') + '</div>' +
  '<p class="small" style="margin-top:11px">Отобрано по близости расхода и давления к рабочей точке этой ' +
  'позиции — по опубликованным краям диапазонов, без методики подбора. Методику завод не передал.</p>';
}

/* ═══════════════════════════════════════════════════════════════════════
   7. ОТРИСОВКА
   ═══════════════════════════════════════════════════════════════════════ */

}

const tabsHTML = () => TABS.map((t, i) =>
  '<button class="tab" type="button" role="tab" id="tb' + i + '" aria-controls="tp' + i +
  '" aria-selected="' + (st.tab === i) + '" tabindex="' + (st.tab === i ? 0 : -1) + '">' + t + '</button>').join('');

function tabBody(i, r, ser) {
  if (i === 0) return tabTech(r, ser);
  if (i === 1) return tabAero(r, ser);
  if (i === 2) return tabGab(r);
  return tabAcou(r);
}

/* Ярлык в углу листа — та же тройка, что и на переключателе. Отдельного
   написания «Вид общий» в разметке больше нет: подпись угла и подпись под
   чертежом обязаны говорить об одной и той же отрисовке. */
const VLBL = {view:'Вид общий', cut:'Разрез', gab:'Габарит'};

/* Перечерчивание фигуры: замена, а не мигание */
function redraw() {
  const fig = $('#pcFig');
  if (!fig) return;
  const paint = () => {
    const lbl = VLBL[st.view];
    fig.innerHTML = '<span class="vlbl">' + lbl + '</span>' + figure();
    delete fig.dataset.redraw;
    const cap = $('#pcFigCap');
    if (cap) cap.textContent = viewCap();
  };
  if (VP.reduced.matches) { paint(); return; }
  fig.dataset.redraw = '1';
  setTimeout(paint, 90);
}

/* Пересчёт паспорта после смены исполнения — без перерисовки всей страницы,
   чтобы вёрстка не прыгала */
function repaintIsp() {
  const r = st.row;
  $('#ispExpl').textContent = ispText();
  const art = $('#pcArt');
  if (art) art.textContent = artOf(r, st.ind, st.sch);
  const specs = $$('.specs dd');
  const dts = $$('.specs dt span');
  for (let i = 0; i < dts.length; i++) {
    const k = dts[i].textContent;
    if (k === 'Масса') {
      const m = massOf(r, st.ind);
      specs[i].innerHTML = m === null ? NO : '≈ <b>' + C.fmt(m) + '</b><i>кг</i>';
    }
    if (k === 'Температура среды') {
      const t = tempOf(r, st.ind);
      specs[i].innerHTML = t === null ? NO : 'до <b>' + C.dec(t) + '</b><i>°С</i>';
    }
  }
  /* Плитки пересобираются целиком, а не переписываются атрибутом: смену
     aria-pressed на уже отрисованной кнопке движок раскраски пропускает,
     и выбранной остаётся прежняя плитка. Проверено на Edge 138. */
  $('#ispInd').innerHTML = indRow(r);
  $('#ispSch').innerHTML = schRow(r);
  const stg = $('.stage[data-go="isp"] em');
  if (stg) stg.textContent = indWord(r) + (st.sch ? ' · схема №' + st.sch : '');
  /* Технические характеристики зависят от исполнения массой и температурой */
  const tp0 = $('#tp0');
  if (tp0) tp0.innerHTML = tabTech(r, C.seriesOf(r.mk));
  redraw();
  pushURL('replace');
}

/* ═══════════════════════════════════════════════════════════════════════
   8. СОБЫТИЯ
   ═══════════════════════════════════════════════════════════════════════ */
function selectTab(i, focus) {
  st.tab = i;
  $('.tabs').innerHTML = tabsHTML();            /* пересборка, а не правка атрибута */
  for (let k = 0; k < TABS.length; k++) $('#tp' + k).hidden = k !== i;
  if (focus) $('#tb' + i).focus();
}

function goSku(id, mode) {
  const r = C.sku(id);
  if (!r) return;
  st.row = r;
  const inds = r.ind && r.ind.length ? r.ind : ['-'];
  if (inds.indexOf(st.ind) < 0) st.ind = inds[0];
  const schs = r.sch || [];
  if (schs.indexOf(st.sch) < 0) st.sch = schs[0] || '';
  if (!hasRazv(r)) st.razv = 'ПР0°';
  pushURL(mode || 'push');
  render();
}

document.addEventListener('click', e => {
  const t = e.target;

  const view = t.closest('.vsw button');
  if (view) {
    st.view = view.dataset.view;
    $('.vsw').innerHTML = vswHTML();
    redraw();
    return;
  }
  const ind = t.closest('.chip[data-ind]');
  if (ind && !ind.disabled) { st.ind = ind.dataset.ind; repaintIsp(); return; }

  const sch = t.closest('.chip[data-sch]');
  if (sch && !sch.disabled) { st.sch = sch.dataset.sch; repaintIsp(); return; }

  const razv = t.closest('[data-razv]');
  if (razv && !razv.disabled) {
    st.razv = razv.dataset.razv;
    $('#tp2').innerHTML = tabGab(st.row);       /* панель пересобирается целиком */
    if (st.view === 'gab') redraw();
    return;
  }
  const tab = t.closest('.tab');
  if (tab) { selectTab($$('.tab').indexOf(tab), false); return; }

  const go = t.closest('.neigh a[data-go]');
  if (go) { e.preventDefault(); goSku(go.dataset.go, 'push'); return; }

  const stg = t.closest('.stage[data-go="isp"]');
  if (stg) {
    const band = $('#ispBand');
    if (band) {
      band.scrollIntoView({block:'center', behavior:VP.reduced.matches ? 'auto' : 'smooth'});
      const first = band.querySelector('.chip:not(:disabled)');
      if (first) first.focus();
    }
    return;
  }
  if (t.closest('#pcPick')) { togglePick(); return; }
  if (t.closest('#pcCmp'))  { compare(); return; }
  if (t.closest('#pcKp'))   { openKP(); return; }
});

/* Клавиатура вкладок: ← → Home End */
document.addEventListener('keydown', e => {
  if (!e.target.classList || !e.target.classList.contains('tab')) return;
  const i = $$('.tab').indexOf(e.target), n = TABS.length;
  let to = -1;
  if (e.key === 'ArrowRight') to = (i + 1) % n;
  else if (e.key === 'ArrowLeft') to = (i - 1 + n) % n;
  else if (e.key === 'Home') to = 0;
  else if (e.key === 'End') to = n - 1;
  if (to < 0) return;
  e.preventDefault();
  selectTab(to, true);
});

/* Кнопка «назад». popstate прилетает и при штатном адресе, и при запасном
   хвостовом; hashchange страхует его на случай ручной правки адреса. */
function backSync() {
  const sig = location.search + '|' + location.hash;
  if (sig === lastSig) return;
  lastSig = sig;
  if (readURL()) render();
}
addEventListener('popstate', backSync);
addEventListener('hashchange', backSync);

/* ── «В ЗАПРОС» и «Сравнить» ───────────────────────────────────────── */
function togglePick() {
  store.togglePick(st.row.id);
  syncPick();
  const on = store.pick.indexOf(st.row.id) >= 0;
  $('#pcSay').textContent = on
    ? 'Позиция добавлена в запрос — счётчик в шапке вырос. Перечень собирается в кабинете, там же из него ' +
      'делается объект и спецификация.'
    : 'Позиция убрана из запроса. Счётчик в шапке уменьшился.';
}
function syncPick() {
  const b = $('#pcPick');
  if (!b) return;
  const on = store.pick.indexOf(st.row.id) >= 0;
  b.setAttribute('aria-pressed', String(on));
  b.textContent = on ? 'В запросе ✓' : 'В ЗАПРОС';
}
addEventListener('vp:store', syncPick);

/* Сравнение живёт в кабинете: позиция уходит в подбор, и об этом говорится
   прямо, а не кнопкой, которая никуда не ведёт. */
function compare() {
  const id = st.row.id;
  if (store.pick.indexOf(id) < 0) store.togglePick(id);
  syncPick();
  $('#pcSay').innerHTML = 'Позиция поставлена в подбор для сравнения — сравнение идёт таблицей в кабинете: ' +
    '<a href="cabinet.html#pick">открыть подбор</a>. Всего в подборе: ' + store.pick.length + '.';
}

/* ═══════════════════════════════════════════════════════════════════════
   9. ПОЯСНЕНИЕ К ПОДПИСИ ХАРАКТЕРИСТИКИ
   ═══════════════════════════════════════════════════════════════════════ */
const tip = document.createElement('div');
tip.className = 'tip';
tip.id = 'pcTip';
tip.setAttribute('role', 'tooltip');
tip.hidden = true;
function tipShow(el) {
  const dt = el.closest('dt[data-tip]');
  if (!dt || !dt.dataset.tip) return;
  const host = $('#page');
  if (tip.parentNode !== host) host.appendChild(tip);
  tip.textContent = dt.dataset.tip;
  tip.hidden = false;
  const hb = host.getBoundingClientRect(), b = el.getBoundingClientRect();
  const x = Math.max(4, Math.min(b.left - hb.left, hb.width - 280));
  tip.style.left = x + 'px';
  tip.style.top = (b.bottom - hb.top + 7) + 'px';
  requestAnimationFrame(() => { tip.dataset.on = '1'; });
  el.setAttribute('aria-describedby', 'pcTip');
}
function tipHide() {
  tip.dataset.on = '0';
  tip.hidden = true;
  for (const el of $$('[aria-describedby="pcTip"]')) el.removeAttribute('aria-describedby');
}
document.addEventListener('pointerover', e => {
  const s = e.target.closest && e.target.closest('.specs dt[data-tip] span');
  if (s) tipShow(s); else if (!e.target.closest || !e.target.closest('#pcTip')) tipHide();
});
document.addEventListener('focusin', e => {
  const s = e.target.closest && e.target.closest('.specs dt[data-tip] span');
  if (s) tipShow(s); else tipHide();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') tipHide(); });

/* ═══════════════════════════════════════════════════════════════════════
   10. ЗАПРОС КОММЕРЧЕСКОГО ПРЕДЛОЖЕНИЯ
   Backend нет. Заявка кладётся в состояние пользователя и в этот браузер;
   пользователю сказано ровно это, без «письмо отправлено».
   ═══════════════════════════════════════════════════════════════════════ */
const KPKEY = 'vp.kp.v1';
let lastFocus = null;

function openKP() {
  const r = st.row;
  lastFocus = document.activeElement;
  $('#mdlHost').innerHTML =
    '<div class="mdl" id="kp" role="dialog" aria-modal="true" aria-labelledby="kpH">' +
      '<div class="box">' +
        '<div class="hd"><div><h2 id="kpH">Запросить КП</h2>' +
          '<p class="who">' + esc(artOf(r, st.ind, st.sch)) + '</p></div>' +
          '<button type="button" id="kpX" aria-label="Закрыть окно">' + ICON.close + '</button></div>' +
        '<div class="bd">' +
          '<form id="kpF" novalidate>' +
            '<div class="two">' +
              '<label class="fld"><span>Имя *</span><input id="kpName" name="name" autocomplete="name">' +
                '<span class="err" hidden></span></label>' +
              '<label class="fld"><span>Компания</span><input id="kpOrg" name="org" autocomplete="organization"></label>' +
            '</div>' +
            '<div class="two">' +
              '<label class="fld"><span>Телефон</span><input id="kpTel" name="tel" inputmode="tel" autocomplete="tel">' +
                '<span class="err" hidden></span></label>' +
              '<label class="fld"><span>Почта</span><input id="kpMail" name="mail" inputmode="email" autocomplete="email">' +
                '<span class="err" hidden></span></label>' +
            '</div>' +
            '<p class="small" style="margin:-4px 0 12px">Телефон или почта — что-то одно обязательно, иначе ответить некуда.</p>' +
            '<label class="fld"><span>Комментарий</span><textarea id="kpMsg" rows="3" ' +
              'placeholder="Объект, количество, сроки, особые требования"></textarea></label>' +
            '<div class="ft"><button class="btn" type="submit" id="kpGo">Оставить запрос</button>' +
              '<button class="btn btn--ghost" type="button" id="kpC">Отмена</button></div>' +
          '</form>' +
          '<p class="say" id="kpSay" hidden></p>' +
          '<p class="legal">Отправки не происходит: приёмной формы на сервере ещё нет. Запрос сохраняется ' +
            'в этом браузере и попадёт к менеджеру после подключения Битрикс24. Цена появится из 1С ERP ' +
            'через административную панель — в автоматическом ответе её пока не будет. Гарантия зависит ' +
            'от позиции (закон плюс до 3–5 лет у части оборудования), точный срок по марке уточнит менеджер.</p>' +
        '</div>' +
      '</div>' +
    '</div>';

  const box = $('#kp');
  const F = () => $$('a[href],button:not([disabled]),input,textarea,select', box).filter(el => el.offsetParent !== null);
  $('#kpName').focus();

  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeKP(); return; }
    if (e.key !== 'Tab') return;
    const f = F();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  box.addEventListener('mousedown', e => { if (e.target === box) closeKP(); });
  $('#kpX').addEventListener('click', closeKP);
  $('#kpC').addEventListener('click', closeKP);
  $('#kpF').addEventListener('submit', submitKP);
}

function closeKP() {
  $('#mdlHost').innerHTML = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function setErr(id, msg) {
  const inp = $('#' + id), fld = inp.closest('.fld'), err = $('.err', fld);
  if (msg) {
    fld.dataset.err = '1';
    inp.setAttribute('aria-invalid', 'true');
    if (err) { err.textContent = msg; err.hidden = false; }
  } else {
    delete fld.dataset.err;
    inp.removeAttribute('aria-invalid');
    if (err) { err.textContent = ''; err.hidden = true; }
  }
  return !msg;
}

function submitKP(e) {
  e.preventDefault();
  const name = $('#kpName').value.trim(), tel = $('#kpTel').value.trim(), mail = $('#kpMail').value.trim();
  const say = $('#kpSay');
  let ok = true;
  ok = setErr('kpName', name.length >= 2 ? '' : 'Как к вам обращаться? Минимум два знака.') && ok;
  const digits = tel.replace(/[^\d]/g, '');
  ok = setErr('kpTel', !tel || digits.length >= 10 ? '' : 'В номере меньше десяти цифр — проверьте.') && ok;
  ok = setErr('kpMail', !mail || /^[^@\s]+@[^@\s]+\.[a-zA-Zа-яА-Я]{2,}$/.test(mail) ? '' : 'Адрес без «собаки» или домена.') && ok;
  if (!tel && !mail) {
    setErr('kpTel', 'Оставьте телефон или почту — иначе ответить некуда.');
    ok = false;
  }
  if (!ok) {
    say.hidden = false; say.dataset.s = 'err';
    say.textContent = 'Запрос не сохранён: поправьте отмеченные поля.';
    const bad = $('[aria-invalid="true"]');
    if (bad) bad.focus();
    return;
  }

  const btn = $('#kpGo');
  btn.disabled = true;
  btn.textContent = 'Сохраняем…';
  say.hidden = false; delete say.dataset.s;
  say.textContent = 'Сохраняем запрос в этом браузере…';

  setTimeout(() => {
    const rec = {
      id:'kp' + Date.now().toString(36),
      sku:st.row.id, art:artOf(st.row, st.ind, st.sch),
      name:name, org:$('#kpOrg').value.trim(), tel:tel, mail:mail,
      msg:$('#kpMsg').value.trim(), ts:Date.now(), client:store.clientId, sent:false,
    };
    try {
      store.kp = store.kp || [];
      store.kp.unshift(rec);
      let all = [];
      try { all = JSON.parse(localStorage.getItem(KPKEY) || '[]'); } catch (err) { all = []; }
      all.unshift(rec);
      localStorage.setItem(KPKEY, JSON.stringify(all.slice(0, 40)));
      store.save();
      say.dataset.s = 'ok';
      say.innerHTML = '<b>Запрос сохранён в этом браузере.</b> Письмо НЕ отправлено: приёмной формы на ' +
        'сервере ещё нет. Как только подключим Битрикс24, запрос уйдёт менеджеру — вместе с позицией ' +
        '<span class="num">' + esc(rec.art) + '</span> и вашими контактами. Номер записи: ' +
        '<span class="num">' + rec.id + '</span>.';
      btn.textContent = 'Сохранено';
      $('#kpF').reset();
      $('#kpC').textContent = 'Закрыть';
    } catch (err) {
      say.dataset.s = 'err';
      say.textContent = 'Сохранить не удалось: браузер запретил запись (приватный режим или переполнено ' +
        'хранилище). Позвоните 8 800 550 10 08 — это надёжнее, чем ещё одна попытка.';
      btn.disabled = false;
      btn.textContent = 'Повторить';
    }
  }, 320);
}

/* ═══════════════════════════════════════════════════════════════════════
   11. ПОЗИЦИЯ НЕ НАЙДЕНА — не белый экран
   ═══════════════════════════════════════════════════════════════════════ */
function renderGone() {
  const q = params().get('p') || '';
  document.title = 'Позиция не найдена · Каталог · Вентпром';
  $('#page').innerHTML =
    '<nav class="crumbs" aria-label="Хлебные крошки"><a href="catalog.html">Каталог</a><i>›</i>' +
    '<b aria-current="page">позиция не найдена</b></nav>' +
    '<div class="sheet sheet--pad gone">' +
      '<h2 style="margin-bottom:10px">Такой позиции в каталоге нет</h2>' +
      '<p style="color:var(--ink-2)">' + (q
        ? 'Адрес открыт с параметром <span class="num">p=' + esc(q) + '</span>, но под этим обозначением ' +
          'в каталоге ничего не лежит. Возможно, позицию переименовали или адрес набран с ошибкой.'
        : 'Карточка открывается с обозначением позиции в адресе, например ' +
          '<span class="num">product.html?p=vr-80-75-6-3</span>. Параметра нет — показывать нечего.') + '</p>' +
      '<label class="fld" style="max-width:420px"><span>Найти позицию</span>' +
        '<input id="goneQ" type="search" placeholder="ВР 80-75, вр80-75 6,3, 8000" autocomplete="off">' +
        '<span class="hint">Поиск терпим к написанию: «BP 80 75» и «вр80-75» находят одно и то же.</span></label>' +
      '<ul class="hits" id="goneHits"></ul>' +
      '<p class="small" id="goneHint" hidden>Если по обозначению ничего не совпало, поиск добирает ' +
        'позиции с ближайшим расходом — числа в запросе он читает как м³/ч.</p>' +
      '<p style="margin-top:18px"><a class="btn" href="catalog.html">Открыть каталог</a>' +
        '<a class="btn btn--ghost" href="podbor.html" style="margin-left:8px">Подобрать по Q и P</a></p>' +
    '</div>';

  const inp = $('#goneQ'), box = $('#goneHits');
  const paint = () => {
    const hits = C.search(inp.value, 10);
    box.innerHTML = hits.length
      ? hits.map(r => '<li><a href="product.html?p=' + r.id + '"><span class="mk">' + esc(titleOf(r)) + '</span><span class="gr">' + (r.q === null ? 'Q не опубликован' : C.fmt(r.q) + ' м³/ч') +
          '</span></a></li>').join('')
      : (inp.value.trim()
          ? '<li><p class="small" style="padding:9px 2px;margin:0">Ничего не нашлось. Попробуйте марку без номера — ' +
            'например «ВР 80-75».</p></li>'
          : '');
    $('#goneHint').hidden = !hits.length;
  };
  inp.addEventListener('input', paint);
  if (q) { inp.value = q.replace(/-/g, ' '); paint(); }
  inp.focus();
}

/* ═══════════════════════════════════════════════════════════════════════
   12. СТАРТ
   ═══════════════════════════════════════════════════════════════════════ */
if (readURL()) {
  pushURL('replace');
  lastSig = location.search + '|' + location.hash;
  render();
} else { renderGone(); }

})();
</script>
</body>
</html>
