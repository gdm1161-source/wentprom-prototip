<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Раздел каталога · Вентпром — тема «Атлассиан»</title>
<meta name="description" content="Раздел каталога: плитки подразделов сужают выдачу, фасеты со счётчиками слева, сводная таблица всех типоразмеров раздела с сортировкой по любому числовому столбцу.">
<!--
  Этот файл — НОВАЯ страница, альтернативный визуальный вариант razdel.html.
  Оригинал (razdel.html) не менялся ни на строку и продолжает работать как
  раньше. Здесь тот же HTML, те же скрипты и те же данные (assets/vp.js,
  assets/catalog.vp.js, assets/data.vp.js, assets/silh.js) — фильтры,
  сравнение, виртуализация таблицы и адресная строка ?r=… ведут себя
  идентично оригиналу. Отличается только оформление: подключены два
  дополнительных файла в конце head/body — assets/atlassian-theme.css
  перекрывает переменные и классы системы «Чертёж» под язык atlassian.com
  (белый лист, синий акцент, скругления, мягкая тень, обычный регистр
  заголовков), assets/wheel-cards.js раскладывает плитки подразделов
  веером и оживляет их при наведении.
-->
<link rel="stylesheet" href="assets/vp.css">
<link rel="stylesheet" href="assets/cat.css">
<style>
/* Локальный слой РАЗДЕЛА.
   Плитки, крошки, стадии, рейка, группы фасетов, полоса выбранного и
   чипы берутся из cat.css без переопределений. Здесь только то, чего в
   системе нет: окно виртуализированной таблицы, диапазонные чипы,
   полоса сравнения и мелкая правка шапки. */

.rz{padding-block:16px 10px}
/* .lay задаёт display:grid и перебивает служебный hidden браузера —
   без этой строки скрытая половина страницы остаётся на листе. */
#full[hidden],#alt[hidden]{display:none}
.pagehead h1{flex:0 1 auto;min-width:0;font-size:clamp(22px,2.8vw,34px)}
.pagehead .dim{margin-bottom:0}

/* ── Диапазонные чипы Q и P ─────────────────────────────────────────
   Готовый интервал одним нажатием; счётчик у каждого, пустой — гаснет. */
.qb{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.qb .chip{padding:4px 9px;font-size:12px}
.qb .chip i{font-style:normal;margin-left:6px;color:var(--ink-4)}
.qb .chip[aria-pressed="true"] i{color:#fff}
.qb .chip:disabled i{color:var(--ink-4)}
.fgrp .fc{
  margin-left:auto;font-family:var(--f-num);font-size:11px;
  color:#fff;background:var(--blue);padding:1px 6px;letter-spacing:0;
}
.fgrp .fc[hidden]{display:none}

/* ── Полоса над таблицей ────────────────────────────────────────────── */
.tbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:12px 0 9px}
.tbar .n{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2)}
.tbar .tip{font-size:12.5px;color:var(--ink-3)}
.sortb{
  display:inline-flex;align-items:center;justify-content:flex-end;width:100%;
  padding:0;background:none;border:0;font:inherit;color:inherit;cursor:pointer;
  text-transform:inherit;letter-spacing:inherit;
}
th.l .sortb{justify-content:flex-start}
.sortb:hover{color:var(--blue)}
/* Сортировка для сложенной строки: шапки таблицы на узком листе нет,
   а сортировать надо — те же ключи и то же состояние, другой орган. */
.msort{display:none;align-items:center;gap:8px;flex:1 1 100%;margin-top:4px}
.msort .fld{flex:1 1 auto;min-width:0}
.msort .fld select{height:36px;font-size:13.5px}
.msort .btn{flex:0 0 auto}

/* ── Окно таблицы: в DOM живут только видимые строки ─────────────────
   Прокрутка своя, поэтому липкая шапка таблицы прилипает к верху окна,
   а не к системным 66 px — иначе она уедет вниз и накроет первую строку. */
.vtbl{
  max-height:min(64vh,720px);overflow:auto;
  border:1px solid var(--rule-ink);border-top:0;
}
.vtbl table.data thead th{top:0}
.vtbl table.data td{border-bottom:1px solid var(--rule-fine)}
.vtbl tr.pad td{padding:0;border:0;background:var(--paper-hi)}
.vtbl td.acts .ib{padding:0 9px;height:30px}
.vtbl td.acts .ib svg{width:17px;height:15px}
.vtbl a.szb{
  font-family:var(--f-num);color:var(--blue);text-decoration:underline;
  text-underline-offset:3px;
}
.vtbl tbody tr[data-cmp="1"] td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.vtbl tbody tr[data-id]:hover{cursor:pointer}
.tiles .fill{background:var(--paper-hi)}
/* Неопубликованная величина: прочерк, а не ноль, и он приглушён */
.na{color:var(--ink-4);cursor:help}
.picked #chips{display:flex;flex-wrap:wrap;gap:8px}
.tnote{margin:9px 0 0;font-size:12px;line-height:1.45;color:var(--ink-3);max-width:96ch}
.empty[hidden],.cmp[hidden]{display:none}
.empty h3{margin-bottom:8px}
.empty p{max-width:74ch;color:var(--ink-2)}

/* ── Полоса сравнения ───────────────────────────────────────────────── */
.cmp{margin-top:18px}
.cmp .hd{
  display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:9px 14px;
  border:1px solid var(--rule-ink);border-bottom:0;background:var(--paper-2);
}
.cmp .hd h2{font-size:12px;letter-spacing:.14em}
.cmp .hd .n{font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.cmp .hd .acts{margin-left:auto;display:flex;gap:8px}
.cmp .row{
  display:flex;flex-wrap:wrap;gap:8px;padding:11px 14px;
  border:1px solid var(--rule-ink);border-bottom:0;background:var(--paper-hi);
}
.cmp .tw{overflow-x:auto;border:1px solid var(--rule-ink)}
.cmp table.data thead th{top:0}
.cmp table.data th.pn{
  position:static;text-align:left;padding:8px 10px;white-space:nowrap;
  background:var(--paper-2);border-bottom:1px solid var(--rule-fine);border-top:0;
  font-family:var(--f-draw);text-transform:uppercase;letter-spacing:.11em;
  font-size:10.5px;font-weight:700;color:var(--ink-2);
}

/* ═══ Ноутбучная полоса: таблица без столбца «Исполнения» ═════════════
   Здесь мышь и широкий обзор, поэтому таблица остаётся таблицей. Но целиком
   она не влезает, и что-то уходит в боковую прокрутку. Уходит «Исполнения»:
   самый широкий и единственный текстовый столбец, к тому же полностью
   повторённый в карточке. «Достоверность» остаётся на виду всегда — это
   пометка о том, что под маркой лежит таблица чужой серии, и прятать её
   за обрез нельзя. Столбец скрыт честно: и ячейки, и заголовок, поэтому
   из дерева доступности он уходит вместе с подписью, а не остаётся
   заголовком без данных. */
@media (min-width:961px) and (max-width:1219px){
  #thead th:nth-child(8),
  .vtbl tbody tr[data-id] td:nth-child(8){display:none}
  /* Снятого столбца хватает от 1030 px и выше, а в нижней части полосы
     таблице нужно ещё около сотни пикселей. Берём их плотностью, а не
     вторым снятым столбцом: числа важнее воздуха между ними, и McMaster
     здесь плотнее нас. Меньше 6 px по горизонтали не опускаем — столбцы
     перестают читаться как отдельные. */
  .vtbl table.data thead th,
  .vtbl table.data td{padding-left:6px;padding-right:6px}
  .vtbl table.data td{font-size:12.5px}
  .vtbl td.acts .ib{padding:0 7px}
}

/* ═══ Строка-запись: ниже 960 px таблица складывается по вертикали ═════
   Горизонтальная прокрутка обесценивает спец-таблицу: на телефоне видны
   марка и кнопка действия, а расход, давление и мощность уезжают за обрез —
   сравнивать нечего, а сравнение и есть смысл этой таблицы. Строка остаётся
   строкой таблицы (сортировка, виртуализация, переход в карточку — те же),
   но раскладывается парами «подпись — значение»: марка и номер заголовком,
   под ними числа, ниже исполнения и достоверность, действия в подвале.
   Подписи столбцов приезжают из data-l той же ячейки. */
@media (max-width:960px){
  .cmp .hd .acts{margin-left:0;width:100%}
  .msort{display:flex}

  /* Окно прокрутки сохраняется: на нём стоит виртуализация, и именно на
     слабом телефоне 156 строк в DOM держать нельзя. */
  .vtbl{max-height:min(72vh,620px)}
  .vtbl table.data,.vtbl thead,.vtbl tbody,.vtbl tr{display:block}
  .vtbl thead{display:none}
  .vtbl table.data{width:100%}

  .vtbl tbody tr[data-id]{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:8px 10px;padding:11px 13px;
    background:var(--paper-hi);border-bottom:1px solid var(--rule);
  }
  .vtbl tbody tr[data-id] td{
    display:block;padding:0;border:0;background:none;text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:13.5px;
  }
  .vtbl tbody tr[data-id] td.dim2{color:var(--ink-3)}
  .vtbl tbody tr[data-id]:hover{background:var(--blue-wash)}
  .vtbl tbody tr[data-id]:hover td{background:none}
  .vtbl tbody tr[data-picked="1"]{background:var(--ok-pale)}
  .vtbl tbody tr[data-picked="1"] td{background:none}
  .vtbl tbody tr[data-cmp="1"]{box-shadow:inset 3px 0 0 var(--blue)}
  .vtbl tbody tr[data-cmp="1"] td:first-child{box-shadow:none}
  /* Распорки виртуализации остаются простыми блоками заданной высоты */
  .vtbl tbody tr.pad{display:block;padding:0;border:0;background:none}

  .vtbl td[data-l]::before{
    content:attr(data-l);display:block;margin-bottom:1px;
    font-family:var(--f-draw);text-transform:uppercase;letter-spacing:.12em;
    font-size:9.5px;color:var(--ink-2);
  }
  .vtbl td.mk{font-size:16px;line-height:1.15}
  .vtbl a.szb{font-size:14px}
  .vtbl td.acts{position:static;box-shadow:none}
  .vtbl td.acts>span{justify-content:flex-start;gap:8px}
  .vtbl td.acts .ib{height:34px;padding:0 16px}

  /* Раскладка: четыре колонки — марка на три, номер на одну */
  .vtbl tbody tr[data-id] td:nth-child(1){grid-area:1/1/2/4}
  .vtbl tbody tr[data-id] td:nth-child(2){grid-area:1/4/2/5;text-align:right}
  .vtbl tbody tr[data-id] td:nth-child(3){grid-area:2/1/3/2}
  .vtbl tbody tr[data-id] td:nth-child(4){grid-area:2/2/3/3}
  .vtbl tbody tr[data-id] td:nth-child(5){grid-area:2/3/3/4}
  .vtbl tbody tr[data-id] td:nth-child(6){grid-area:2/4/3/5}
  .vtbl tbody tr[data-id] td:nth-child(7){grid-area:3/1/4/2}
  .vtbl tbody tr[data-id] td:nth-child(9){grid-area:3/2/4/3}
  .vtbl tbody tr[data-id] td:nth-child(8){grid-area:3/3/4/5}
  .vtbl tbody tr[data-id] td:nth-child(10){grid-area:4/1/5/5}
}
@media (max-width:620px){
  /* На телефоне заголовок делится пополам: марке и номеру нужна ширина,
     иначе «ПКВ-1м (60/90)» и «№ не опубликован» уезжают в многоточие */
  .vtbl tbody tr[data-id] td:nth-child(1){grid-area:1/1/2/3}
  .vtbl tbody tr[data-id] td:nth-child(2){grid-area:1/3/2/5}
  /* Числа встают парами: две колонки вместо четырёх */
  .vtbl tbody tr[data-id] td:nth-child(3){grid-area:2/1/3/3}
  .vtbl tbody tr[data-id] td:nth-child(4){grid-area:2/3/3/5}
  .vtbl tbody tr[data-id] td:nth-child(5){grid-area:3/1/4/3}
  .vtbl tbody tr[data-id] td:nth-child(6){grid-area:3/3/4/5}
  .vtbl tbody tr[data-id] td:nth-child(7){grid-area:4/1/5/3}
  .vtbl tbody tr[data-id] td:nth-child(9){grid-area:4/3/5/5}
  .vtbl tbody tr[data-id] td:nth-child(8){grid-area:5/1/6/5}
  .vtbl tbody tr[data-id] td:nth-child(10){grid-area:6/1/7/5}
}
</style>
<link rel="stylesheet" href="assets/atlassian-theme.css">
</head>
<body>
<!--
IMPECCABLE DIRECTION CONTRACT · мир «Чертёж»
THESIS: Раздел — рабочий лист: подразделы сужают выдачу без перехода, фасеты
несут счётчики, а сводная таблица показывает все типоразмеры раздела разом.
OWN-WORLD: бумага с миллиметровкой, волосяная линовка вместо теней, приборный
синий на структуре, сигнальный оранжевый только на действии.
STORY: инженер отсекает лишнее слева, сортирует по Q и уходит в карточку
строкой таблицы, не заходя в шесть серий по очереди.
FORM: «Чертёж» закреплён распоряжением заказчика; раунд направления не проводился.

── АЛЬТЕРНАТИВНЫЙ ВАРИАНТ ОФОРМЛЕНИЯ (этот файл) ──────────────────────────
Контракт выше описывает ОРИГИНАЛ (razdel.html) — он не тронут и продолжает
жить своей жизнью. Этот файл поверх той же разметки и логики накатывает
второй, явно запрошенный язык — «как atlassian.com»: белый лист вместо
миллиметровки, приборный синий на месте чертёжного, скругления и мягкая
тень вместо волосяной линовки, обычный регистр заголовков. THESIS и STORY
не меняются — меняется только OWN-WORLD и FORM.
-->

<div class="ambient" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
</div>

<div id="vp-head"></div>

<main>
  <div class="wrap rz pagehead" id="head"></div>

  <!-- ПОЛНЫЙ РАЗДЕЛ: рейка фасетов, плитки подразделов, сводная таблица -->
  <div class="wrap lay lay--wide" id="full" hidden>
    <aside>
      <details class="rail" id="rail" open>
        <summary>Отбор<span class="n" id="railSum"></span></summary>
        <div class="top">
          <h2>Отбор</h2>
          <span class="n" id="railN"></span>
        </div>
        <div id="facets"></div>
        <button class="btn btn--ghost btn--sm reset" type="button" id="reset" disabled>
          Сбросить отбор
        </button>
      </details>
    </aside>

    <div>
      <h2 class="vh">Подразделы</h2>
      <div class="tiles tiles--sm" id="subs" role="group" aria-label="Подразделы: сужают выдачу"></div>

      <div class="picked" id="picked" hidden>
        <span class="lbl">Отобрано</span>
        <span id="chips"></span>
        <button class="btn btn--ghost btn--sm reset" type="button" id="reset2">Сбросить всё</button>
      </div>

      <div class="tbar">
        <span class="n" id="shown" role="status" aria-live="polite" tabindex="-1"></span>
        <span class="tip">Строка — типоразмер: она ведёт в карточку. Заголовки
          числовых столбцов сортируют выдачу.</span>
        <div class="msort">
          <label class="fld" for="msortK"><span class="vh">Сортировать по столбцу</span>
            <select id="msortK"></select></label>
          <button class="btn btn--ghost btn--sm" type="button" id="msortD"
                  aria-pressed="false" disabled>По возрастанию</button>
        </div>
      </div>

      <div class="vtbl" id="vtbl">
        <table class="data" id="tbl">
          <caption class="vh" id="tcap"></caption>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="tnote" id="tnote"></p>

      <div class="sheet sheet--pad empty" id="empty" hidden>
        <h3>Под условия не проходит ни одна позиция</h3>
        <p id="emptyWhy"></p>
        <button class="btn btn--ghost" type="button" id="emptyReset">Сбросить отбор</button>
      </div>

      <section class="cmp" id="cmp" hidden aria-label="Сравнение позиций">
        <div class="hd">
          <h2>Сравнение</h2>
          <span class="n" id="cmpN"></span>
          <div class="acts">
            <button class="btn btn--ghost btn--sm" type="button" id="cmpClear">Очистить</button>
          </div>
        </div>
        <div class="row" id="cmpRow"></div>
        <div class="tw" id="cmpTable"></div>
      </section>
    </div>
  </div>

  <!-- РАЗДЕЛ БЕЗ ЗАВОДСКИХ ТАБЛИЦ и НЕИЗВЕСТНЫЙ АДРЕС -->
  <div class="wrap" id="alt" hidden></div>
</main>

<div id="vp-foot"></div>

<script src="assets/vp.js"></script>
<script>
(() => {
'use strict';
const {$, $$, ICON, store} = VP;
const C = VPCAT;

VP.init('catalog.html');

/* ═══ Мелочи ═════════════════════════════════════════════════════════ */
const plural = (n, a, b, c) => {
  const m = n % 100, k = n % 10;
  return n + ' ' + (m >= 11 && m <= 14 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c);
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const nsku = n => plural(n, 'типоразмер', 'типоразмера', 'типоразмеров');
const nser = n => plural(n, 'серия', 'серии', 'серий');
const nsub = n => plural(n, 'подраздел', 'подраздела', 'подразделов');

/* Силуэт берётся защитно: файл силуэтов собирается отдельно и может
   появиться позже страницы — без него раздел обязан открыться. */
function silh(keys) {
  for (const k of keys) if (window.VPSILH && window.VPSILH[k]) return window.VPSILH[k];
  for (const k of keys) if (VP.BIG[k]) return VP.BIG[k];
  for (const k of keys) if (VP.ICON[k]) {
    return VP.ICON[k].replace(/width="[\d.]+" height="[\d.]+"/, 'width="72" height="62"');
  }
  return '';
}
/* Форма подраздела: улитка, кольцо осевого, зонт крышного, короб канального.
   Первым в цепочке стоит имя собственного силуэта подраздела — когда файл
   силуэтов доедет, страница возьмёт его без правки кода; пока в ход идёт
   ближайший по форме крупный силуэт системы. */
const SILH = {
  rad:['radial', 'scroll1'], ax:['axial'], roof:['roof'], kan:['ductext', 'ductk'],
  prom:['dust', 'scrollmp'], vd:['hp', 'scroll5'], ind:['heavy', 'scroll1'],
  tyaga:['smoke', 'scroll5'], shaht:['mine', 'axial'],
  du:['fire', 'scrollmp'], klap:['damper'],
  ahu:['ahu'], duct:['duct'], filter:['filter'], heat:['heat'],
  panel:['panel'], grille:['grille'], fix:['fix'], draft:['draft'],
};
const subSilh = s => silh(SILH[s.id] || SILH[s.ic] || [s.ic]);

/* Форма раздела — та же, что на верхнем уровне каталога: узнаётся плитка,
   а не читается подпись. */
const RSILH = {
  obshch:['radial', 'scroll1'], vent:['heavy', 'scroll5'], pvu:['ahu'],
  kkr   :['ductk', 'ductround'], kpr:['ductext', 'ductk'], ppv:['fire', 'damper'],
  avt   :['panel'], tep:['heat'], det:['draft'], vzd:['duct'],
  vrp   :['grille'], flt:['filter'], krp:['fix'],
};

/* Хвост ряда плиток добивается пустой бумагой: незанятая клетка сетки
   показывает подложку линовки, то есть дыру в листе. */
function fillGrid(el) {
  if (!el) return;
  for (const f of $$('.fill', el)) f.remove();
  const cols = getComputedStyle(el).gridTemplateColumns.split(' ').filter(Boolean).length;
  const need = cols > 0 ? (cols - el.childElementCount % cols) % cols : 0;
  el.insertAdjacentHTML('beforeend',
    '<span class="tile fill" aria-hidden="true"></span>'.repeat(need));
}
addEventListener('resize', () => $$('.tiles').forEach(fillGrid), {passive:true});

function renderFull() {
document.title = `${RZ.name} · Каталог · Вентпром`;

const ALL  = C.SKU.filter(r => r.razdel === RZ.id);
const IDX  = new Map(ALL.map((r, i) => [r.id, i]));
const SUBS = C.SUB.filter(s => s.razdel === RZ.id);
const uniq = arr => [...new Set(arr)];

/* ═══ Фасеты раздела ═════════════════════════════════════════════════
   Набор опций строится ПО ДАННЫМ раздела: в клапанах нет схем привода,
   в общеобменных нет сейсмостойкого исполнения — выдумывать пустые
   строки фасета нельзя. */
const FACETS = [
  {k:'t', t:'Тип агрегата', test:(r, v) => r.type === v,
   opts:uniq(ALL.map(r => r.type)).map(v => ({v, l:C.TYPE[v] || v}))},

  {k:'isp', t:'Исполнение', test:(r, v) => r.ind.indexOf(v) >= 0,
   opts:uniq([].concat(...ALL.map(r => r.ind))).map(v => ({v, l:C.IND[v] || v}))},

  {k:'sch', t:'Схема привода', test:(r, v) => r.sch.indexOf(v) >= 0,
   opts:uniq([].concat(...ALL.map(r => r.sch))).sort()
          .map(v => ({v, l:'Схема № ' + v, tip:C.SCH[v] || ''}))},

  {k:'tmp', t:'Температура среды', test:(r, v) => String(r.t) === v,
   opts:uniq(ALL.map(r => r.t)).sort((a, b) => a - b)
          .map(v => ({v:String(v), l:'до +' + v + ' °C'}))},

  {k:'d', t:'Достоверность данных', test:(r, v) => r.data === v,
   opts:uniq(ALL.map(r => r.data))
          .sort((a, b) => ['ok', 'part', 'dup'].indexOf(a) - ['ok', 'part', 'dup'].indexOf(b))
          .map(v => ({v, l:C.DATA[v].short, tip:C.DATA[v].t}))},
];

/* Готовые интервалы Q и P. Края — «круглые» числа, взятые от квартилей
   самого раздела, а не выдуманная шкала: в клапанах и в тягодутьевых
   машинах порядки величин разные. */
function nice(v) {
  if (!isFinite(v) || v <= 0) return 0;
  const e = Math.pow(10, Math.floor(Math.log10(v))), m = v / e;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * e;
}
function edges(vals) {
  const s = vals.filter(v => v !== null && isFinite(v)).sort((a, b) => a - b);
  if (s.length < 8) return [];
  const q = p => s[Math.min(s.length - 1, Math.floor(p * s.length))];
  return uniq([nice(q(0.25)), nice(q(0.5)), nice(q(0.75))])
           .filter(v => v > s[0] && v < s[s.length - 1]).sort((a, b) => a - b);
}
function bands(vals) {
  const e = edges(vals), out = [];
  for (let i = 0; i <= e.length; i++) {
    const lo = i === 0 ? null : e[i - 1], hi = i === e.length ? null : e[i];
    if (lo === null && hi === null) continue;
    out.push({lo, hi,
      l:lo === null ? 'до ' + C.fmt(hi)
      : hi === null ? 'более ' + C.fmt(lo)
      : C.fmt(lo) + ' … ' + C.fmt(hi)});
  }
  return out;
}
const QB = bands(ALL.map(r => r.q));
const PB = bands(ALL.map(r => r.p));

/* ═══ Состояние страницы ═════════════════════════════════════════════
   Живёт в адресе целиком: ссылка передаётся коллеге, «назад» возвращает
   ровно ту выдачу, из которой ушли. */
const F = {s:null, q0:null, q1:null, p0:null, p1:null,
           t:new Set(), isp:new Set(), sch:new Set(), tmp:new Set(), d:new Set()};
let SORT = null, DIR = 1;
const CMP = [];
const CMPMAX = 4;

function readUrl() {
  const p = new URLSearchParams(location.search);
  const sid = (p.get('s') || '').trim();
  F.s = SUBS.some(x => x.id === sid) ? sid : null;
  for (const k of ['q0', 'q1', 'p0', 'p1']) {
    const v = (p.get(k) || '').trim();
    F[k] = v !== '' && isFinite(+v) ? +v : null;
  }
  for (const f of FACETS) {
    F[f.k].clear();
    const raw = (p.get(f.k) || '').trim();
    if (!raw) continue;
    for (const v of raw.split(',')) if (f.opts.some(o => o.v === v)) F[f.k].add(v);
  }
  const so = (p.get('sort') || '').trim();
  DIR = so.charAt(0) === '-' ? -1 : 1;
  const key = so.replace(/^-/, '');
  SORT = COLS.some(c => c.k === key && c.sort) ? key : null;
}
function url() {
  const p = new URLSearchParams();
  p.set('r', RZ.id);
  if (F.s) p.set('s', F.s);
  for (const k of ['q0', 'q1', 'p0', 'p1']) if (F[k] !== null) p.set(k, String(F[k]));
  for (const f of FACETS) if (F[f.k].size) p.set(f.k, [...F[f.k]].join(','));
  if (SORT) p.set('sort', (DIR < 0 ? '-' : '') + SORT);
  return '?' + p.toString();
}
/* Отбор не плодит истории: каждый щелчок фасета заменяет адрес, а не
   добавляет запись. Иначе «назад» из карточки пришлось бы жать двадцать раз. */
function syncUrl() {
  try { history.replaceState(null, '', url()); } catch (e) { /* file:// без истории */ }
}
addEventListener('popstate', () => { readUrl(); paintControls(); update(); });

/* ═══ Отбор ══════════════════════════════════════════════════════════
   skip — ключ фасета, который при подсчёте не учитываем: именно так
   считается счётчик у его собственных опций. */
function pass(r, skip) {
  if (skip !== 's' && F.s && r.sub !== F.s) return false;
  if (skip !== 'q') {
    if (F.q0 !== null || F.q1 !== null) {
      if (r.q === null) return false;
      if (F.q0 !== null && r.q < F.q0) return false;
      if (F.q1 !== null && r.q > F.q1) return false;
    }
  }
  if (skip !== 'p') {
    if (F.p0 !== null || F.p1 !== null) {
      if (r.p === null) return false;
      if (F.p0 !== null && r.p < F.p0) return false;
      if (F.p1 !== null && r.p > F.p1) return false;
    }
  }
  for (const f of FACETS) {
    if (skip === f.k || !F[f.k].size) continue;
    let hit = false;
    for (const v of F[f.k]) if (f.test(r, v)) { hit = true; break; }
    if (!hit) return false;
  }
  return true;
}
const anyFilter = () => !!(F.s || F.q0 !== null || F.q1 !== null || F.p0 !== null || F.p1 !== null
  || FACETS.some(f => F[f.k].size));

/* ═══ Столбцы сводной таблицы ════════════════════════════════════════ */
const szNum = r => typeof r.size === 'number' ? r.size : parseFloat(String(r.size)) || 0;
const NOQ = 'Завод не публикует эту величину для изделия: у клапанов нет ни ' +
            'аэродинамической таблицы, ни перечня сечений. Ноль здесь был бы выдумкой.';
const NORPM = 'Колонки оборотов на странице серии нет — величина не опубликована.';
const num = (v, tip) => v === null
  ? `<span class="na" title="${esc(tip)}">—</span>` : C.fmt(v);

const COLS = [
  {k:'mk',   t:'Марка',      cls:'l mk', sort:r => r.mk,   cell:r => esc(r.mk)},
  /* У части серий завод назвал только количество типоразмеров, но не их
     обозначения. В ячейке стоит короткая пометка, полная фраза — в title:
     длинная строка распирала бы столбец на листе и обрывалась на телефоне. */
  {k:'size', t:'№',          cls:'',     sort:r => szNum(r),
   cell:r => `<a class="szb" href="product.html?p=${encodeURIComponent(r.id)}"${
     r.size === null ? ` title="${esc(C.szl(r))}"` : ''
   }>${r.size === null ? '№ не опубл.' : esc(C.szl(r))}</a>`},
  {k:'q',    t:'Q, м³/ч',    cls:'',     sort:r => r.q,    cell:r => num(r.q, NOQ)},
  {k:'p',    t:'Pv, Па',     cls:'',     sort:r => r.p,    cell:r => num(r.p, NOQ)},
  {k:'n',    t:'N, кВт',     cls:'',     sort:r => r.n,
   cell:r => r.n === null ? num(null, NOQ) : C.dec(r.n)},
  {k:'rpm',  t:'n, об/мин',  cls:'',     sort:r => r.rpm,  cell:r => num(r.rpm, NORPM)},
  {k:'mass', t:'Масса, кг',  cls:'',     sort:r => r.mass, cell:r => num(r.mass, NOQ)},
  {k:'ind',  t:'Исполнения', cls:'l',    sort:null, cell:indCell},
  {k:'data', t:'Данные',     cls:'l',    sort:null, cell:dataCell},
];
const indShort = v => v === '-' ? 'общепром.' : v;
function indCell(r) {
  const head = r.ind.slice(0, 3).map(indShort).join(' · ');

  return `<span title="${esc(r.ind.map(v => C.indLabel(v, r.mk)).join('; '))}">${head}${tail}</span>`;
}
function dataCell(r) {
  const d = C.DATA[r.data];
  return `<span class="st" data-s="${d.s}" title="${esc(d.t)}">${d.short}</span>`;
}

/* ═══ Счётчики фасетов ═══════════════════════════════════════════════
   Закон: у каждого фасета счётчик; фасет, обнуляющий выдачу, гасится
   заранее и показывает 0. Тупика «найдено 0» на сайте не существует. */
function syncFacets() {
  for (const f of FACETS) {
    let picked = 0;
    for (const lab of $$(`[data-facet="${f.k}"] .opt`)) {
      const v = lab.dataset.o, inp = $('input', lab);
      let n = 0;
      for (const r of ALL) if (pass(r, f.k) && f.test(r, v)) n++;
      $('.n', lab).textContent = n;
      const on = F[f.k].has(v);
      if (on) picked++;
      if (n === 0 && !on) { lab.dataset.empty = '1'; inp.disabled = true; }
      else { delete lab.dataset.empty; inp.disabled = false; }
    }
    const fc = $('#fc-' + f.k);
    fc.hidden = !picked;
    fc.textContent = picked;
  }
  /* Диапазонные чипы Q и P */
  for (const [key, list, sel] of [['q', QB, '#qb'], ['p', PB, '#pb']]) {
    const lo = F[key + '0'], hi = F[key + '1'];
    for (const b of $$('.chip', $(sel))) {
      const band = list[+b.dataset.i];
      let n = 0;
      for (const r of ALL) {
        const v = key === 'q' ? r.q : r.p;
        if (v === null || !pass(r, key)) continue;
        if (band.lo !== null && v < band.lo) continue;
        if (band.hi !== null && v > band.hi) continue;
        n++;
      }
      $('i', b).textContent = n;
      const on = lo === band.lo && hi === band.hi;
      b.setAttribute('aria-pressed', String(on));
      b.disabled = n === 0 && !on;
    }
    const fc = $(key === 'q' ? '#fcq' : '#fcp');
    fc.hidden = lo === null && hi === null;
    fc.textContent = '1';
  }
}

/* ═══ Плитки подразделов: счётчики и нажатое состояние ═══════════════ */
function syncSubs() {
  for (const b of $$('#subs .tile--pick')) {
    const id = b.dataset.s;
    let n = 0;
    for (const r of ALL) if (r.sub === id && pass(r, 's')) n++;
    $('[data-cnt]', b).textContent = n;
    const on = F.s === id;
    b.setAttribute('aria-pressed', String(on));
    if (n === 0 && !on) { b.dataset.empty = '1'; b.disabled = true; }
    else { delete b.dataset.empty; b.disabled = false; }
  }
}

/* ═══ Полоса выбранного ══════════════════════════════════════════════ */
function chip(kind, key, label) {
  return `<span class="chipx">${esc(label)}
    <button type="button" data-drop="${kind}" data-key="${esc(key)}"
      aria-label="Снять условие: ${esc(label)}">${ICON.close}</button></span>`;
}
function syncPicked() {
  const out = [];
  if (F.s) {
    const s = SUBS.find(x => x.id === F.s);
    out.push(chip('s', '', 'подраздел: ' + s.short));
  }
  if (F.q0 !== null || F.q1 !== null) {
    out.push(chip('q', '', 'Q ' + (F.q0 === null ? 'до ' + C.fmt(F.q1)
      : F.q1 === null ? 'от ' + C.fmt(F.q0) : C.fmt(F.q0) + ' … ' + C.fmt(F.q1)) + ' м³/ч'));
  }
  if (F.p0 !== null || F.p1 !== null) {
    out.push(chip('p', '', 'Pv ' + (F.p0 === null ? 'до ' + C.fmt(F.p1)
      : F.p1 === null ? 'от ' + C.fmt(F.p0) : C.fmt(F.p0) + ' … ' + C.fmt(F.p1)) + ' Па'));
  }
  for (const f of FACETS)
    for (const v of F[f.k]) {
      const o = f.opts.find(x => x.v === v);
      out.push(chip(f.k, v, o ? o.l : v));
    }
  $('#chips').innerHTML = out.join('');
  $('#picked').hidden = out.length === 0;
}

/* ═══ Сортировка и выдача ════════════════════════════════════════════ */
let ROWS = [];
function build() {
  const rows = ALL.filter(r => pass(r, null));
  if (SORT) {
    const c = COLS.find(x => x.k === SORT);
    rows.sort((a, b) => {
      const x = c.sort(a), y = c.sort(b);
      /* Неопубликованная величина всегда внизу, в обе стороны сортировки:
         «—» — это не ноль и не бесконечность, ставить её в ряд нельзя. */
      if (x === null && y === null) return IDX.get(a.id) - IDX.get(b.id);
      if (x === null) return 1;
      if (y === null) return -1;
      const d = typeof x === 'string' ? x.localeCompare(y, 'ru') : x - y;
      return d * DIR || IDX.get(a.id) - IDX.get(b.id);
    });
  }
  ROWS = rows;
}

/* ═══ Виртуализация ══════════════════════════════════════════════════
   В разделе «Вентиляторы» 156 строк, а с полным набором действий строка
   стоит около полусотни узлов. В DOM держим только видимое окно плюс
   запас сверху и снизу; место остальных занимают две распорки. */
const box = $('#vtbl'), tbody = $('#tbody');
const OVER = 10;
let ROWH = 47, first = -1, last = -1, raf = 0;

function rowHtml(r, i) {
  const picked = store.pick.indexOf(r.id) >= 0;
  const inCmp = CMP.indexOf(r.id) >= 0;
  const dm = r.edge ? '' : ' dim2';
  const t = r.edge
    ? 'Крайний типоразмер ряда: значения сняты с сайта завода.'
    : 'Промежуточный типоразмер: значения интерполированы между опубликованными краями ряда — для проверки интерфейса, не для подбора.';
  const full = CMP.length >= CMPMAX && !inCmp;
  /* data-l — подпись столбца при себе: на узком листе шапки таблицы нет,
     и число без подписи превращается в набор цифр. Марка и номер подписи
     не требуют, они читаются сами. */
  return `<tr data-id="${r.id}" aria-rowindex="${i + 2}" title="${t}"${
    picked ? ' data-picked="1"' : ''}${inCmp ? ' data-cmp="1"' : ''}>
    ${COLS.map(c => `<td class="${c.cls}${dm}"${
      c.k === 'mk' || c.k === 'size' ? '' : ` data-l="${esc(c.t)}"`}>${c.cell(r)}</td>`).join('')}
    <td class="acts${dm}"><span>
      <button class="btn btn--ghost btn--sm ib" type="button" data-act="pick" data-id="${r.id}"
        aria-pressed="${picked}" title="${picked ? 'Убрать из запроса' : 'В запрос'}"
        aria-label="${picked ? 'Убрать из запроса' : 'В запрос'}: ${esc(r.mk)} ${esc(C.szl(r))}"
        >${picked ? ICON.close : ICON.check}</button>
      <button class="btn btn--ghost btn--sm ib" type="button" data-act="cmp" data-id="${r.id}"
        aria-pressed="${inCmp}"${full ? ' disabled' : ''}
        title="${full ? 'В сравнении уже четыре позиции' : inCmp ? 'Убрать из сравнения' : 'Сравнить'}"
        aria-label="${inCmp ? 'Убрать из сравнения' : 'Сравнить'}: ${esc(r.mk)} ${esc(C.szl(r))}"
        >${ICMP}</button>
    </span></td>
  </tr>`;
}
/* Распорка — чистая геометрия: она держит высоту непоказанных строк и в
   дерево доступности не попадает вовсе, поэтому счёт строк и столбцов
   от неё не сбивается. */
const pad = h => h > 0
  ? `<tr class="pad" role="presentation" aria-hidden="true"><td colspan="${
      COLS.length + 1}" style="height:${h}px"></td></tr>`
  : '';

function paintWindow(force) {
  const top = box.scrollTop, vh = box.clientHeight || 520;
  let a = Math.max(0, Math.floor(top / ROWH) - OVER);
  let b = Math.min(ROWS.length, Math.ceil((top + vh) / ROWH) + OVER);
  if (!force && a === first && b === last) return;
  first = a; last = b;
  tbody.innerHTML = pad(a * ROWH) +
    ROWS.slice(a, b).map((r, i) => rowHtml(r, a + i)).join('') +
    pad((ROWS.length - b) * ROWH);
  /* Высота строки измеряется, а не назначается: она зависит от шрифта,
     а шрифт может не успеть загрузиться к первому кадру. */
  const tr = tbody.querySelector('tr[data-id]');
  if (tr) {
    const h = Math.round(tr.getBoundingClientRect().height);
    if (h && Math.abs(h - ROWH) > 1) { ROWH = h; first = last = -1; paintWindow(true); }
  }
}
/* Перерисовка окна привязана к кадру, но не зависит от него целиком:
   если кадры не выдаются (фоновая вкладка, iframe, экономия батареи),
   защёлка raf осталась бы поднятой навсегда и прокрутка показывала бы
   пустое место. Страховка перерисовывает окно таймером. */
function schedulePaint() {
  if (raf) return;
  const run = () => { raf = 0; paintWindow(false); };
  raf = requestAnimationFrame(run);
  setTimeout(() => { if (raf) { cancelAnimationFrame(raf); run(); } }, 120);
}
box.addEventListener('scroll', schedulePaint, {passive:true});
addEventListener('resize', () => paintWindow(true), {passive:true});

function renderTable() {
  build();
  $('#tbl').setAttribute('aria-rowcount', String(ROWS.length + 1));
  first = last = -1;
  box.scrollTop = 0;
  paintWindow(true);
  /* Второй проход следующим кадром: высоту окна задаёт его же содержимое
     (max-height по 64vh), поэтому в первый кадр запас строк считать не по
     чему — окно ещё в высоту первой строки. */
  requestAnimationFrame(() => paintWindow(true));
  const n = ROWS.length;
  $('#shown').textContent = `показано ${n} из ${ALL.length}`;
  $('#railN').textContent = `${n} из ${ALL.length}`;
  $('#railSum').textContent = `${n} из ${ALL.length}`;
  $('#vtbl').hidden = n === 0;
  $('#tnote').hidden = n === 0;
  $('#empty').hidden = n !== 0;
  if (!n) $('#emptyWhy').innerHTML = why();
  else $('#tnote').innerHTML = tnote();
  for (const th of $$('#thead th[data-k]')) {
    if (th.dataset.k === SORT) th.setAttribute('aria-sort', DIR > 0 ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  }
  /* Тот же порядок, показанный органом для сложенной строки */
  $('#msortK').value = SORT || '';
  const md = $('#msortD');
  md.disabled = !SORT;
  md.setAttribute('aria-pressed', String(DIR < 0));
  md.textContent = DIR < 0 ? 'По убыванию' : 'По возрастанию';
}

/* Подпись под таблицей объясняет ровно то, что видно в выдаче */
function tnote() {
  const out = [];
  const noq = ROWS.filter(r => r.q === null || r.p === null).length;
  const norpm = ROWS.filter(r => r.rpm === null).length;
  const nosz = ROWS.filter(r => r.size === null).length;
  const inter = ROWS.filter(r => !r.edge).length;
  if (noq) out.push(`У ${plural(noq, 'позиции', 'позиций', 'позиций')} вместо Q и Pv стоит
    прочерк: завод не публикует по ним аэродинамику. Прочерк — это не ноль,
    и в отбор по диапазону такие строки не попадают.`);
  if (norpm) out.push(`У ${plural(norpm, 'позиции', 'позиций', 'позиций')} нет колонки оборотов —
    её нет и на странице серии.`);
  if (nosz) out.push(`У ${plural(nosz, 'позиции', 'позиций', 'позиций')} обозначение типоразмера
    заводом не опубликовано: известно только их количество.`);
  if (inter) out.push(`Приглушённые строки (${inter}) интерполированы между опубликованными
    краями ряда — для проверки интерфейса, не для подбора.`);
  return out.join(' ');
}

/* Какое условие слишком жёсткое: снимаем по одному и смотрим, что откроется */
function why() {
  const act = [];
  if (F.s) act.push(['s', 'подраздел']);
  if (F.q0 !== null || F.q1 !== null) act.push(['q', 'диапазон расхода Q']);
  if (F.p0 !== null || F.p1 !== null) act.push(['p', 'диапазон давления Pv']);
  for (const f of FACETS) if (F[f.k].size) act.push([f.k, f.t.toLowerCase()]);
  if (!act.length) return 'Отбор пуст, а строк нет — это сбой данных, а не условий.';
  const open = act.filter(([k]) => ALL.some(r => pass(r, k)));
  if (open.length) {
    return 'Условия перекрыли друг друга. Достаточно снять одно: ' +
      open.map(([, t]) => `<b>${t}</b>`).join(' или ') + '.';
  }
  return `Наложено ${plural(act.length, 'условие', 'условия', 'условий')} — ` +
    act.map(([, t]) => t).join(', ') +
    '. Снятия одного мало: они исключают друг друга, нужен полный сброс.';
}

/* ═══ Полоса сравнения ═══════════════════════════════════════════════ */
/* Марку и номер несёт шапка столбца — повторять их строками не нужно */
const CFIELDS = [
  {l:'Q, м³/ч',      v:r => num(r.q, NOQ)},
  {l:'Pv, Па',       v:r => num(r.p, NOQ)},
  {l:'N, кВт',       v:r => r.n === null ? num(null, NOQ) : C.dec(r.n)},
  {l:'n, об/мин',    v:r => num(r.rpm, NORPM)},
  {l:'Масса, кг',    v:r => num(r.mass, NOQ)},
  {l:'Тип',          v:r => C.TYPE[r.type] || r.type},
  {l:'Температура',  v:r => 'до +' + r.t + ' °C'},
  {l:'Исполнения',   v:r => r.ind.map(indShort).join(' · ')},
  {l:'Схемы привода',v:r => r.sch.length ? r.sch.map(s => '№' + s).join(' · ') : '—'},
  {l:'Данные',       v:r => dataCell(r)},
];
/* Кнопки сравнения правятся на месте, а не пересборкой окна таблицы:
   пересборка убила бы кнопку, на которой стоит фокус, и клавиатурный
   обход строк оборвался бы на первом же сравнении. */
function syncCmpButtons() {
  const full = CMP.length >= CMPMAX;
  for (const tr of $$('#tbody tr[data-id]')) {
    const id = tr.dataset.id, on = CMP.indexOf(id) >= 0, r = C.sku(id);
    if (on) tr.dataset.cmp = '1'; else delete tr.dataset.cmp;
    const b = $('[data-act="cmp"]', tr);
    b.setAttribute('aria-pressed', String(on));
    b.disabled = full && !on;
    b.title = b.disabled ? 'В сравнении уже четыре позиции'
            : on ? 'Убрать из сравнения' : 'Сравнить';
    b.setAttribute('aria-label',
      `${on ? 'Убрать из сравнения' : 'Сравнить'}: ${r.mk} ${C.szl(r)}`);
  }
}
function renderCmp() {
  const rows = CMP.map(id => C.sku(id)).filter(Boolean);
  $('#cmp').hidden = rows.length === 0;
  if (!rows.length) return;
  $('#cmpN').textContent = `${rows.length} из ${CMPMAX}`;
  $('#cmpRow').innerHTML = rows.map(r => `<span class="chipx">${esc(r.mk)} ${esc(C.szl(r))}
    <button type="button" data-uncmp="${r.id}"
      aria-label="Убрать из сравнения: ${esc(r.mk)} ${esc(C.szl(r))}">${ICON.close}</button></span>`).join('');
  $('#cmpTable').innerHTML = rows.length < 2
    ? `<p style="margin:0;padding:12px 14px;font-size:13px;color:var(--ink-3);background:var(--paper-hi)">
         Добавьте вторую позицию — сравнивать одну не с чем.</p>`
    : `<table class="data"><caption class="vh">Сравнение выбранных типоразмеров</caption>
       <thead><tr><th class="l" scope="col">Параметр</th>${
         rows.map(r => `<th class="l" scope="col">${esc(r.mk)}<br>${esc(C.szl(r))}</th>`).join('')}</tr></thead>
       <tbody>${CFIELDS.map(f => `<tr>
         <th class="pn" scope="row">${f.l}</th>${
         rows.map(r => `<td class="${/Тип|Исполнения|Схемы|Данные/.test(f.l) ? 'l' : ''}">${f.v(r)}</td>`).join('')}
       </tr>`).join('')}
       <tr><th class="pn" scope="row">Карточка</th>${
         rows.map(r => `<td class="l"><a href="product.html?p=${encodeURIComponent(r.id)}">открыть</a></td>`).join('')}
       </tr></tbody></table>`;
}

/* ═══ Стадии ═════════════════════════════════════════════════════════
   Пройденная ступень кликабельна, непройденная отключена и об этом
   говорит. Ступень «Серия» открывается сама, когда в выдаче осталась
   одна марка: тогда лист серии — законный следующий шаг. */
function syncStages() {
  const st = $('[data-st="s"]');
  const marks = [...new Set(ROWS.map(r => r.mk))];
  if (marks.length === 1) {
    st.disabled = false;
    st.dataset.on = '1';
    $('em', st).textContent = marks[0];
    st.title = 'Открыть лист серии ' + marks[0];
  } else {
    st.disabled = true;
    st.dataset.on = '0';
    $('em', st).textContent = marks.length ? `${marks.length} в выдаче` : 'не выбрана';
    st.title = 'Серия выбирается сужением выдачи или строкой таблицы';
  }
}

/* ═══ Пересчёт всего ═════════════════════════════════════════════════ */
function update(skipUrl) {
  syncSubs();
  syncFacets();
  syncPicked();
  renderTable();
  syncStages();
  $('#reset').disabled = !anyFilter();
  if (!skipUrl) syncUrl();
}

/* ═══ События ════════════════════════════════════════════════════════ */
/* Плитка подраздела — фильтр: сужает выдачу, не уводя со страницы */
$('#subs').addEventListener('click', e => {
  const b = e.target.closest('[data-s]');
  if (!b || b.disabled) return;
  F.s = F.s === b.dataset.s ? null : b.dataset.s;
  update();
});

/* Фасеты-флажки */
$('#facets').addEventListener('change', e => {
  const inp = e.target.closest('input[data-f]');
  if (!inp) return;
  const set = F[inp.dataset.f];
  if (inp.checked) set.add(inp.value); else set.delete(inp.value);
  update();
});

/* Диапазонные чипы */
$('#facets').addEventListener('click', e => {
  const b = e.target.closest('.chip[data-b]');
  if (!b || b.disabled) return;
  const key = b.dataset.b, band = (key === 'q' ? QB : PB)[+b.dataset.i];
  const on = F[key + '0'] === band.lo && F[key + '1'] === band.hi;
  F[key + '0'] = on ? null : band.lo;
  F[key + '1'] = on ? null : band.hi;
  paintControls();
  update();
});

/* Числовые поля: выдача перерисовывается по вводу, без кнопки «Применить» */
let tm = 0;
for (const id of ['q0', 'q1', 'p0', 'p1']) {
  $('#' + id).addEventListener('input', () => {
    clearTimeout(tm);
    tm = setTimeout(() => {
      const v = $('#' + id).value.trim();
      F[id] = v === '' || !isFinite(+v) ? null : +v;
      update();
    }, 220);
  });
}

/* Снятие одного условия и полный сброс */
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-drop]');
  if (!b) return;
  const k = b.dataset.drop;
  if (k === 's') F.s = null;
  else if (k === 'q') { F.q0 = F.q1 = null; }
  else if (k === 'p') { F.p0 = F.p1 = null; }
  else F[k].delete(b.dataset.key);
  paintControls();
  update();
});
function resetAll() {
  F.s = null; F.q0 = F.q1 = F.p0 = F.p1 = null;
  for (const f of FACETS) F[f.k].clear();
  paintControls();
  update();
}
$('#reset').addEventListener('click', resetAll);
$('#reset2').addEventListener('click', resetAll);
$('#emptyReset').addEventListener('click', () => { resetAll(); $('#shown').focus(); });

/* Сортировка по любому числовому столбцу */
$('#thead').addEventListener('click', e => {
  const b = e.target.closest('.sortb');
  if (!b) return;
  const k = b.closest('th').dataset.k;
  if (SORT === k) DIR = -DIR; else { SORT = k; DIR = 1; }
  update();
});
/* Та же сортировка для сложенной строки: состояние одно на двоих */
$('#msortK').innerHTML = '<option value="">Порядок ряда</option>' +
  COLS.filter(c => c.sort).map(c => `<option value="${c.k}">${esc(c.t)}</option>`).join('');
$('#msortK').addEventListener('change', e => {
  SORT = e.target.value || null;
  DIR = 1;
  update();
});
$('#msortD').addEventListener('click', () => { DIR = -DIR; update(); });

/* Строка ведёт в карточку; кнопки в строке работают сами по себе */
$('#tbody').addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.disabled) return;
    const id = act.dataset.id;
    if (act.dataset.act === 'pick') { store.togglePick(id); return; }
    const i = CMP.indexOf(id);
    if (i >= 0) CMP.splice(i, 1);
    else if (CMP.length < CMPMAX) CMP.push(id);
    syncCmpButtons();
    renderCmp();
    return;
  }
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr[data-id]');
  if (tr) location.href = 'product.html?p=' + encodeURIComponent(tr.dataset.id);
});

/* Полоса сравнения */
$('#cmpRow').addEventListener('click', e => {
  const b = e.target.closest('[data-uncmp]');
  if (!b) return;
  const i = CMP.indexOf(b.dataset.uncmp);
  if (i >= 0) CMP.splice(i, 1);
  syncCmpButtons();
  renderCmp();
});
$('#cmpClear').addEventListener('click', () => {
  CMP.length = 0;
  syncCmpButtons();
  renderCmp();
  $('#shown').focus();
});

/* Запрос изменился где угодно — правим только видимые строки, чтобы не
   уводить фокус с кнопки, на которой стоит пользователь */
addEventListener('vp:store', () => {
  const picked = new Set(store.pick);
  for (const tr of $$('#tbody tr[data-id]')) {
    const id = tr.dataset.id, on = picked.has(id), r = C.sku(id);
    if (on) tr.dataset.picked = '1'; else delete tr.dataset.picked;
    const b = $('[data-act="pick"]', tr);
    b.setAttribute('aria-pressed', String(on));
    b.title = on ? 'Убрать из запроса' : 'В запрос';
    b.setAttribute('aria-label', `${on ? 'Убрать из запроса' : 'В запрос'}: ${r.mk} ${C.szl(r)}`);
    b.innerHTML = on ? ICON.close : ICON.check;
  }
});

/* Стадии */
$('#head').addEventListener('click', e => {
  const b = e.target.closest('.stage');
  if (!b || b.disabled) return;
  if (b.dataset.st === 'r') {
    resetAll();
    $('#subs').scrollIntoView({block:'start', behavior:VP.reduced.matches ? 'auto' : 'smooth'});
  }
  if (b.dataset.st === 's') {
    const mk = [...new Set(ROWS.map(r => r.mk))][0];
    if (mk) location.href = 'series.html?s=' + encodeURIComponent(mk);
  }
});

/* Рейка на узком листе складывается, на широком стоит открытой */
const wide = matchMedia('(min-width:961px)');
const syncRail = () => { $('#rail').open = wide.matches; };
wide.addEventListener('change', syncRail);
syncRail();

/* ═══ Первый рисунок ═════════════════════════════════════════════════ */
head(RZ, `${nsub(SUBS.length)} · ${nsku(ALL.length)}`);
$('#full').hidden = false;
fillGrid($('#subs'));      /* только после показа: у скрытой сетки колонок нет */
paintControls();
update(true);
renderCmp();
syncUrl();
}
})();
</script>
<script src="assets/wheel-cards.js"></script>
</body>
</html>
